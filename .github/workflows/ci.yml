name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src/crimewatch scripts tests
      - name: Unit tests
        run: pytest -m "not slow" -q
      - name: App smoke tests
        run: pytest -m slow -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Static security scan (bandit)
        run: bandit -q -r src app scripts -ll
      - name: Known-vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t crimewatch:ci .
      - name: Container starts and passes its health check
        run: |
          docker run -d --name cw -e CW_AUTH_MODE=local -p 8501:8501 crimewatch:ci
          for i in $(seq 1 30); do curl -fsS localhost:8501/_stcore/health && ok=1 && break; sleep 2; done
          docker logs cw
          docker rm -f cw
          test "$ok" = 1
